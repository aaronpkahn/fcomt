<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FComT Local Visualizer</title>
    <link rel="stylesheet" href="/ui/style.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>FComT Local Visualizer</h1>
        <p>Inspect live metrics and seed example scenarios.</p>
      </header>

      <section class="panel">
        <h2>Scenario Seeder</h2>
        <div class="row">
          <select id="scenario-select"></select>
          <button id="seed-btn">Load Example</button>
          <span id="seed-status"></span>
        </div>
      </section>

      <section class="panel grid">
        <article>
          <h3>Current Profile</h3>
          <p id="profile-value">-</p>
        </article>
        <article>
          <h3>Targets</h3>
          <p id="targets-value">-</p>
        </article>
        <article>
          <h3>Incidents (24h)</h3>
          <p id="incidents-value">-</p>
        </article>
      </section>

      <section class="panel">
        <h2>Target Summaries (24h)</h2>
        <table>
          <thead>
            <tr>
              <th>Target</th>
              <th>Samples</th>
              <th>Availability</th>
              <th>Loss</th>
              <th>Avg Latency</th>
              <th>P95</th>
              <th>Jitter</th>
            </tr>
          </thead>
          <tbody id="summary-body"></tbody>
        </table>
      </section>

      <section class="panel">
        <div class="chart-head">
          <h2>Latency Over Time</h2>
          <div class="row">
            <label for="timeseries-target">Target</label>
            <select id="timeseries-target"></select>
            <label for="timeseries-window">Window</label>
            <select id="timeseries-window">
              <option value="24h">24h</option>
              <option value="168h" selected>7d</option>
            </select>
          </div>
        </div>
        <canvas id="timeseries-canvas" height="260"></canvas>
      </section>

      <section class="panel">
        <h2>Incidents</h2>
        <ul id="incident-list"></ul>
      </section>
    </main>
    <script src="/ui/app.js"></script>
  </body>
  </html>
